# Full DPO run. Effective batch = per_device * grad_accum * num_gpus.
# Starts from the pretrained Instruct model when sft_adapter_path is null.

sft_adapter_path: null
beta: 0.1
loss_type: sigmoid
attn_implementation: flash_attention_2
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
num_train_epochs: 3
max_steps: 5000
learning_rate: 1.0e-5
warmup_steps: 0
warmup_ratio: 0.1
weight_decay: 1.0e-3
max_grad_norm: 1.0
lr_scheduler_type: cosine
bf16: true
fp16: false
logging_steps: 10
save_strategy: steps
save_steps: 500
save_total_limit: 1
eval_strategy: steps
eval_steps: 500
eval_on_start: true
max_eval_samples_per_ds: 1000
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
gradient_checkpointing: true
max_length: null
report_to: wandb
seed: 0
use_liger_kernel: false
optim: adamw_torch_fused
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8
resume_from_checkpoint: null
deepspeed: null
precompute_ref_log_probs: false
padding_free: false
remove_unused_columns: false
